name: Pre-check for forbidden strings

on:
  workflow_call:
    secrets:
      PRECHECK_PATTERN:
        required: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    env:
      PRECHECK_PATTERN: ${{ secrets.PRECHECK_PATTERN }}
    steps:
      - uses: actions/checkout@v4

      - name: Pre-check for forbidden strings
        run: |
          set -euo pipefail

          # Only check for forbidden patterns supplied via the secret.
          # If none are provided, skip the check.
          if [ -z "${PRECHECK_PATTERN:-}" ]; then
            echo "No PRECHECK_PATTERN supplied; skipping forbidden-pattern check."
            exit 0
          fi

          # Support multiple patterns separated by '|'.
          IFS='|' read -r -a PATTERNS <<< "${PRECHECK_PATTERN}"
          pattern=$(printf "%s|" "${PATTERNS[@]}" | sed 's/|$//')

          echo "Searching repository for forbidden patterns..."
          set +e
          matches=$(git grep -nIE --break --heading -e "$pattern" || true)
          set -e
          if [ -n "$matches" ]; then
            echo "Pre-check failed: found matches for forbidden strings:"
            echo "$matches"
            exit 1
          fi
